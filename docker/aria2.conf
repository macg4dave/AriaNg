# Disposable local testing only. The RPC secret is appended at startup.
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=false
dir=/downloads
file-allocation=none
max-concurrent-downloads=4
max-connection-per-server=2
split=1
enable-dht=false
enable-dht6=false
enable-peer-exchange=false
bt-enable-lpd=false
disable-ipv6=true
check-certificate=true
no-netrc=true
connect-timeout=5
timeout=10
max-tries=1
download-result=hide
console-log-level=error
summary-interval=0
