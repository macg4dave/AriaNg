worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Request URLs may contain RPC tokens; do not log them.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    send_timeout 20s;
    client_body_timeout 20s;
    limit_conn_zone $binary_remote_addr zone=gateway_clients:1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /var/www/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /jsonrpc {
            proxy_pass http://aria2:6800/jsonrpc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            client_max_body_size 1m;
        }

        # Resolve the optional Compose service only when this route is used.
        # Browser bearer credentials are forwarded; upstream credentials stay there.
        location /v1/servers/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $gateway_upstream http://gateway:8081;
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Origin $http_origin;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_send_timeout 20s;
            proxy_buffering off;
            client_max_body_size 2m;
            limit_conn gateway_clients 64;
        }

        location = /test-fixture.bin {
            alias /opt/test-fixture.bin;
            default_type application/octet-stream;
        }

        location / {
            try_files $uri $uri/ =404;
            # Revalidate so rebuilt test images do not leave stale assets.
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
